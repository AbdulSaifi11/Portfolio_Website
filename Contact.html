<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="css/bootstrap.min.css"> -->
     <style>
        .container{
            width: 100vw;
            height: 100vh;
            background-image:url("https://img.freepik.com/free-vector/paper-style-dynamic-lines-background_23-2149008629.jpg");
              background-repeat: no-repeat;
            background-size: cover;
        }
        .form{
            padding:200px;
        }
        label{
            color: blanchedalmond;
        }
     </style>
       
</head>
<body>
    <div class="container">
        <form action="#" class="form">
            <label for="name"  >Enter Name</label><br>
            <input type="text" id="name" placeholder="Enter Name" required><br>
            <label for="name">Enter Email</label><br>
            <input type="text" placeholder="Enter Email" id="name" required><br>
            <label for="name">Enter Mobile</label><br>
            <input type="text" placeholder="Enter Mobile" id="name" required><br>
            <label for="name">Enter Address</label><br>
            <textarea type="text" placeholder="Enter Address" id="name" required></textarea><br>
            <input type="submit" >
            <input type="reset">
        </form>
    </div>
    <script>
    document.querySelector("input").addEventListener("mouseover", () => {
        document.getElementById("name").style.backgroundColor = "red";
    });

     </script>
</body>
</html>
